name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source
        env:
          SOURCE_TARBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o source.tar.gz "$SOURCE_TARBALL"
          tar -xzf source.tar.gz --strip-components=1
          rm source.tar.gz

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy fascat/

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Spot OS cells: cross-platform breakage (paths, subprocess, wheels) is
      # rarely Python-version-specific, and windows/macos minutes bill 2x/10x.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Fetch source
        shell: bash
        env:
          SOURCE_TARBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o source.tar.gz "$SOURCE_TARBALL"
          tar -xzf source.tar.gz --strip-components=1
          rm source.tar.gz

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies with optional backends
        if: runner.os != 'Windows'
        run: uv sync --dev --all-extras

      - name: Install dependencies without meshopt on Windows
        if: runner.os == 'Windows'
        run: uv sync --dev --extra ktx2 --extra unwrap

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

  windows-base-install:
    name: Windows base install without C++ build tools
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Fetch source
        shell: bash
        env:
          SOURCE_TARBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o source.tar.gz "$SOURCE_TARBALL"
          tar -xzf source.tar.gz --strip-components=1
          rm source.tar.gz

      - name: Build wheel
        run: py -m pip wheel --no-deps --wheel-dir dist .

      - name: Install base wheel
        shell: pwsh
        run: py -m pip install (Get-ChildItem dist/fascat-*.whl)

      - name: Verify installation
        run: py -m fascat --version

  core:
    name: Core without CAD/USD backends
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source
        env:
          SOURCE_TARBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o source.tar.gz "$SOURCE_TARBALL"
          tar -xzf source.tar.gz --strip-components=1
          rm source.tar.gz

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Remove optional geometry backends
        run: uv pip uninstall cadquery-ocp cadquery-ocp-proxy usd-core xatlas

      - name: Test backend-free core behavior
        run: uv run --no-sync pytest tests/test_mesh.py tests/test_profiles.py tests/test_backend_errors.py --no-cov
